name: SRC-002.REQ-001
description: "Backport evidence must link to the upstream commit, commit range, pull request, advisory, or release note defining the fix"
author: ControlPlane for the FINOS OSERA Exchange
# Reads the job environment set by the fitness workflow (see lib/record.sh for the list of OSERA_* variables). No inputs.
runs:
  using: composite
  steps:
    - name: SRC-002.REQ-001
      shell: bash
      run: |
        set -euo pipefail
        source "$GITHUB_ACTION_PATH/../../../lib/record.sh"
        check_is SRC-002 SRC-002.REQ-001 SRC-002.CHECK-001
        F=.osera/patch-evidence.yaml
        expect "every entry under fixes in $F names a CVE and links the upstream fix (commit, pull request, advisory or release note) with an https URL"

        # 1. the evidence file must be in the repository at the tag
        step "reading $F"
        if [ ! -f "$F" ]; then
          record fail "$F is not in the repository at $OSERA_TAG"
        fi

        # 2. one line per fix: the CVE and the upstream link, placeholders when missing
        FIXES="$(ev yq -r '.fixes // [] | .[] | (.cve // "no-cve") + " " + (.upstream // "no-upstream")' "$F")"
        if [ -z "$FIXES" ]; then
          record fail "$F has no fixes list"
        fi

        # 3. every fix needs a CVE and an https link
        BAD="$(awk '$1 == "no-cve" || $2 !~ /^https:\/\// {print}' <<<"$FIXES")"
        N="$(wc -l <<<"$FIXES" | tr -d ' ')"
        if [ -z "$BAD" ]; then
          record pass "$N fix(es), each with a CVE and an https link to the upstream fix: $(paste -sd';' - <<<"$FIXES")"
        else
          record fail "fix(es) without a CVE or without an https link: $(paste -sd';' - <<<"$BAD")"
        fi
