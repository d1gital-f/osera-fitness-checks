name: FORK-003.REQ-001
description: "Patch providers must tag the unpatched baseline source commit using v<VERSION>+patch.baseline"
author: ControlPlane for the FINOS OSERA Exchange
# Reads the job environment set by the fitness workflow (see lib/record.sh for the list of OSERA_* variables). No inputs.
runs:
  using: composite
  steps:
    - name: FORK-003.REQ-001
      shell: bash
      run: |
        set -euo pipefail
        source "$GITHUB_ACTION_PATH/../../../lib/record.sh"
        check_is FORK-003 FORK-003.REQ-001 FORK-003.CHECK-001
        expect "tag $BASE exists and points to a commit strictly before $OSERA_TAG on the same history"

        # 1. the baseline tag must exist
        step "listing the baseline tags"
        TAGS="$(ev git tag --list "$BASE" '*baseline*')"
        grep -qxF "$BASE" <<<"$TAGS" || record fail "no tag $BASE (tags with baseline in the name: $(paste -sd, - <<<"${TAGS:-none}"))"

        # 2. the two commits: baseline and release
        BASE_SHA="$(ev git rev-parse "refs/tags/${BASE}^{commit}")"
        REL_SHA="$(ev git rev-parse "refs/tags/${OSERA_TAG}^{commit}")"

        # 3. the baseline must come before the release, on the same history
        if [ "$BASE_SHA" = "$REL_SHA" ]; then
          record fail "$BASE and $OSERA_TAG point to the same commit $BASE_SHA, the baseline must come before the patch"
        elif ev git merge-base --is-ancestor "$BASE_SHA" "$REL_SHA" >/dev/null; then
          N="$(ev git rev-list --count "$BASE_SHA..$REL_SHA")"
          record pass "$BASE is $BASE_SHA, $N commit(s) before $OSERA_TAG ($REL_SHA)"
        else
          record fail "$BASE ($BASE_SHA) is not an ancestor of $OSERA_TAG ($REL_SHA)"
        fi
