name: FORK-002.REQ-001
description: "Patch providers must create version-scoped source workflow branches using patch/<version>"
author: ControlPlane for the FINOS OSERA Exchange
# Reads the job environment set by the fitness workflow (see lib/record.sh for the list of OSERA_* variables). No inputs.
runs:
  using: composite
  steps:
    - name: FORK-002.REQ-001
      shell: bash
      run: |
        set -euo pipefail
        source "$GITHUB_ACTION_PATH/../../../lib/record.sh"
        check_is FORK-002 FORK-002.REQ-001 FORK-002.CHECK-001
        expect "a branch patch/$VERSION or patch/$LINE exists and contains the release tag $OSERA_TAG"

        # 1. the patch branches that contain the release tag, among the two names the standard allows
        step "listing the patch branches"
        WITH_TAG="$(ev git branch -r --list "origin/patch/$VERSION" "origin/patch/$LINE" --contains "refs/tags/$OSERA_TAG")"
        WITH_TAG="$(sed 's/^[ *]*//' <<<"$WITH_TAG" | paste -sd, -)"

        # 2. every branch with patch in its name, for the message when none matches
        ALL="$(ev git branch -r --list 'origin/*patch*')"
        ALL="$(sed 's/^[ *]*//' <<<"$ALL" | paste -sd, -)"

        # 3. one matching branch is enough
        if [ -n "$WITH_TAG" ]; then record pass "branch $WITH_TAG contains $OSERA_TAG"
        elif [ -z "$ALL" ]; then record fail "no branch with patch in its name"
        else record fail "branches present: $ALL; none is patch/$VERSION or patch/$LINE containing $OSERA_TAG"; fi
