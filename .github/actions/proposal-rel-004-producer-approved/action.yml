name: CP-REL-004-02 (proposal)
description: "ControlPlane proposal (remediation-standards 52): the producer named in the evidence file is in the approved producers. Warns, never fails"
author: ControlPlane for the FINOS OSERA Exchange
# Reads the job environment set by the fitness workflow (see lib/record.sh for the list of OSERA_* variables). No inputs.
runs:
  using: composite
  steps:
    - name: CP-REL-004-02 (proposal)
      shell: bash
      run: |
        set -euo pipefail
        source "$GITHUB_ACTION_PATH/../../../lib/record.sh"
        check_is REL-004 CP-REL-004-02 ""
        F=.osera/patch-evidence.yaml
        expect "the producer named in $F has an entry in the approved producers file for pack $OSERA_PACK"

        # 1. the evidence file and the producer it names (a proposal: warn, never fail)
        step "reading $F and the approved producers file"
        if [ ! -f "$F" ]; then
          record warn "$F is not in the repository at $OSERA_TAG"
          exit 0
        fi
        P="$(ev yq -r '.producer // ""' "$F")"

        # 2. the approved producers file must be for this pack
        PACK="$(ev yq -r '.applies_to_pack // ""' "$OSERA_APPROVED_PRODUCERS")"
        IDS="$(ev yq -r '.producers[].id' "$OSERA_APPROVED_PRODUCERS")"
        if [ "$PACK" != "$OSERA_PACK" ]; then
          record warn "the approved producers file applies to '$PACK', not $OSERA_PACK"
          exit 0
        fi

        # 3. the producer id must be one of the entries
        if grep -qxF "$P" <<<"$IDS"; then
          record pass "producer '$P' has an entry ($(wc -l <<<"$IDS" | tr -d ' ') entries in the file)"
        else
          record warn "producer '$P' has no entry; ids present: $(paste -sd, - <<<"$IDS")"
        fi
