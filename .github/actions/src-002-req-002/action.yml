name: SRC-002.REQ-002
description: "SRC-002.REQ-002 (SRC-002 0.1.0): Backported commits carrying upstream-authored code should name the upstream commit and include a Co-authored-by trailer for the upstream author (SHOULD, advisory)"
author: ControlPlane for the FINOS OSERA Exchange
# Reads the job environment set by the fitness workflow (see lib/record.sh for the list of OSERA_* variables). No inputs.
runs:
  using: composite
  steps:
    - name: SRC-002.REQ-002
      shell: bash
      run: |
        set -euo pipefail
        source "$GITHUB_ACTION_PATH/../../../lib/record.sh"
        check_is SRC-002 0.1.0 SRC-002.REQ-002 SRC-002.CHECK-002
        expect "every commit between $BASE and $OSERA_TAG whose message names an upstream commit (cherry picked from, backport of, upstream commit) carries a Co-authored-by trailer naming the upstream author"

        # 1. without the baseline tag there is no range to look at: the check stops and is recorded not-tested
        step "resolving the baseline tag $BASE"
        ev git rev-parse -q --verify "refs/tags/${BASE}^{commit}" >/dev/null

        # 2. the commits in the range, and those whose message names an upstream commit
        step "reading the commits between $BASE and $OSERA_TAG"
        TOTAL="$(ev git rev-list --count "${BASE}..${OSERA_TAG}")"
        CARRYING="$(ev git log --format=%H "${BASE}..${OSERA_TAG}" -i --extended-regexp --grep='(cherry picked from commit|backport of|upstream commit|upstream:) *[0-9a-f]{7,40}')"
        if [ -z "$CARRYING" ]; then
          record not-applicable "$TOTAL commit(s) between $BASE and $OSERA_TAG, none names an upstream commit"
          exit 0
        fi

        # 3. each of those must carry a Co-authored-by trailer with a value (a SHOULD: warn, never fail)
        MISSING=""
        for C in $CARRYING; do
          MSG="$(ev git log -1 --format=%B "$C")"
          if ! grep -qE '^Co-authored-by: *[^ ]' <<<"$MSG"; then
            MISSING="$MISSING ${C:0:12}"
          fi
        done
        if [ -n "$MISSING" ]; then
          record warn "commit(s) naming an upstream commit without a Co-authored-by trailer:$MISSING"
        else
          record pass "$(wc -l <<<"$CARRYING" | tr -d ' ') commit(s) name an upstream commit and carry a Co-authored-by trailer"
        fi
